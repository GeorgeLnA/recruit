[build]
  command = "npm run build:client"
  functions = "netlify/functions"
  publish = "dist/spa"

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"
  
[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"

# ============================================
# ASSET OPTIMIZATION & CACHING HEADERS
# ============================================

# Video files - optimized caching and streaming
[[headers]]
  for = "/vids/*"
  [headers.values]
    Accept-Ranges = "bytes"
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
    Content-Type = "video/webm"

# All WebM files
[[headers]]
  for = "/*.webm"
  [headers.values]
    Accept-Ranges = "bytes"
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "video/webm"

# Image optimization - Netlify auto-converts to WebP when supported
[[headers]]
  for = "/optimised/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    # Netlify will auto-optimize images (WebP conversion, compression)

# All image files - enable Netlify image optimization
[[headers]]
  for = "/*.{jpg,jpeg,png,gif,webp}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    # Netlify automatically serves WebP when browser supports it

# Font files - long cache
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# All static assets (JS, CSS, etc.)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML files - short cache (they change more often)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
